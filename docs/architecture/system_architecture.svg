  <text x="108" y="386" font-size="12" font-weight="500" fill="#64748B">server.py · Async REST API endpoints on port 8000</text>


  <rect x="690" y="330" width="540" height="75" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#card-shadow)"/>
