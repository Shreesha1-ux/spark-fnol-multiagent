  <text x="108" y="241" font-size="12" font-weight="500" fill="#64748B">Claimant narrative statement & damage photo upload</text>


  <rect x="690" y="185" width="540" height="75" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#card-shadow)"/>
  <rect x="1110" y="195" width="110" height="20" rx="4" fill="#F1F5F9"/>
  <text x="1165" y="209" font-size="9.5" font-weight="700" fill="#64748B" text-anchor="middle">Vanilla JS / Tailwind</text>
  <text x="708" y="217" font-size="15" font-weight="700" fill="#0F172A">Adjuster Cockpit (SPA)</text>
  <text x="708" y="241" font-size="12" font-weight="500" fill="#64748B">Live Kanban pipeline, HUD metrics, chat assistant & filters</text>


  <rect x="1290" y="185" width="540" height="75" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#card-shadow)"/>
  <rect x="1710" y="195" width="110" height="20" rx="4" fill="#F1F5F9"/>
  <text x="1765" y="209" font-size="9.5" font-weight="700" fill="#64748B" text-anchor="middle">Sidepane Module</text>
  <text x="1308" y="217" font-size="15" font-weight="700" fill="#0F172A">Surveyor Management View</text>
  <text x="1308" y="241" font-size="12" font-weight="500" fill="#64748B">Caseload tracker, Junior/Senior roster & physical dispatch</text>


