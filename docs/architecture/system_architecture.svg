<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop Shadows -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="badge-shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    
    <!-- Arrow Marker -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563EB" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748B" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0D9488" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#E11D48" />
    </marker>
  </defs>


  <!-- Slide Header -->
  <rect x="60" y="35" width="1800" height="90" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="90" y="75" font-size="26" font-weight="800" fill="#0F172A" letter-spacing="-0.5">SPARK FNOL — COMPLETE SYSTEM ARCHITECTURE</text>
  <text x="90" y="102" font-size="14" font-weight="500" fill="#64748B">Layered Overview: Client Interfaces, Backend Services, Agentic Core, Tools & Persistence</text>
  
  <rect x="1480" y="60" width="350" height="34" rx="17" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <circle cx="1500" cy="77" r="5" fill="#2563EB"/>
  <text x="1516" y="82" font-size="11.5" font-weight="700" fill="#1E40AF" letter-spacing="0.5">AEROPHILIA 2026 HACKATHON · AGENTIC AI</text>


  <!-- Layer Container -->
  <rect x="60" y="150" width="1800" height="125" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="80" y="174" font-size="11" font-weight="800" fill="#475569" letter-spacing="0.8">LAYER 1: PRESENTATION LAYER (USER & ADJUSTER INTERFACES)</text>


  <!-- Layer Container -->
  <rect x="60" y="295" width="1800" height="125" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="80" y="319" font-size="11" font-weight="800" fill="#475569" letter-spacing="0.8">LAYER 2: APPLICATION & BACKEND SERVICES (FASTAPI & STATE MANAGER)</text>


  <!-- Layer Container -->
  <rect x="60" y="440" width="1800" height="255" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="80" y="464" font-size="11" font-weight="800" fill="#475569" letter-spacing="0.8">LAYER 3: AGENTIC INTELLIGENCE CORE (CREWAI & MULTIMODAL GEMINI AGENTS)</text>


  <!-- Layer Container -->
  <rect x="60" y="715" width="1800" height="160" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="80" y="739" font-size="11" font-weight="800" fill="#475569" letter-spacing="0.8">LAYER 4: EXTERNAL TOOLS & PERSISTENT DATA STORES</text>


  <!-- Layer Container -->
  <rect x="60" y="895" width="1800" height="140" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="80" y="919" font-size="11" font-weight="800" fill="#475569" letter-spacing="0.8">LAYER 5: DECISION TIERS & HUMAN ADJUSTER GOVERNANCE</text>


  <rect x="90" y="185" width="540" height="75" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#card-shadow)"/>
  <rect x="510" y="195" width="110" height="20" rx="4" fill="#F1F5F9"/>
