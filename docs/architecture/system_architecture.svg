  <text x="1401" y="955" font-size="13.5" font-weight="800" fill="#0F172A">Surveyor Field Dispatch</text>
  <text x="1383" y="982" font-size="11" font-weight="500" fill="#64748B">Dispatches Junior or Senior Surveyor with 2-3 sentence AI reasoning.</text>

