  <text x="958" y="824" font-size="11" font-weight="500" fill="#64748B">Stores verified policy schedules, date windows, IDVs & exclusions</text>


  <rect x="1365" y="750" width="500" height="105" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#card-shadow)"/>
