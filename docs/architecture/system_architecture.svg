  <text x="708" y="362" font-size="15" font-weight="700" fill="#0F172A">Pipeline Stage Engine</text>
  <text x="708" y="386" font-size="12" font-weight="500" fill="#64748B">agents_crew.py · 5-Stage execution & verification runner</text>


  <rect x="1290" y="330" width="540" height="75" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#card-shadow)"/>
  <rect x="1710" y="340" width="110" height="20" rx="4" fill="#F1F5F9"/>
  <text x="1765" y="354" font-size="9.5" font-weight="700" fill="#64748B" text-anchor="middle">Thread-Safe IO</text>
  <text x="1308" y="362" font-size="15" font-weight="700" fill="#0F172A">Atomic State Manager</text>
  <text x="1308" y="386" font-size="12" font-weight="500" fill="#64748B">state_manager.py · ACID-like file persistence & thread safety</text>


  <rect x="90" y="475" width="540" height="95" rx="8" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5" filter="url(#card-shadow)"/>
  <rect x="106" y="487" width="206" height="18" rx="4" fill="#DBEAFE"/>
  <text x="111" y="500" font-size="9.5" font-weight="700" fill="#2563EB">Model: gemini-2.5-flash-lite</text>
  <text x="108" y="525" font-size="14.5" font-weight="800" fill="#0F172A">Agent 1: Statement Analyst</text>
  <text x="108" y="547" font-size="11.5" font-weight="500" fill="#64748B">Extracts claimed zones, dates & liability; filters injection attacks</text>


  <rect x="690" y="475" width="540" height="95" rx="8" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5" filter="url(#card-shadow)"/>
  <rect x="706" y="487" width="367" height="18" rx="4" fill="#DBEAFE"/>
  <text x="711" y="500" font-size="9.5" font-weight="700" fill="#2563EB">Model: Deterministic Engine + gemini-2.5-flash-lite</text>
  <text x="708" y="525" font-size="14.5" font-weight="800" fill="#0F172A">Agent 4: Policy & Coverage Specialist</text>
  <text x="708" y="547" font-size="11.5" font-weight="500" fill="#64748B">Validates in-force period, OD vs TP clauses, IDV & deductibles</text>


  <rect x="1290" y="475" width="540" height="95" rx="8" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5" filter="url(#card-shadow)"/>
