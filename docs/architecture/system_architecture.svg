  <text x="1311" y="500" font-size="9.5" font-weight="700" fill="#2563EB">Model: gemini-2.5-flash Multimodal Vision</text>
  <text x="1308" y="525" font-size="14.5" font-weight="800" fill="#0F172A">Agent 2: Vision Assessor</text>
  <text x="1308" y="547" font-size="11.5" font-weight="500" fill="#64748B">Zone-by-zone pixel inspection without claimant narrative bias</text>


