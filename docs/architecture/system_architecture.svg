  <text x="108" y="635" font-size="14.5" font-weight="800" fill="#0F172A">Agent 3: Supervisor Brain</text>
  <text x="108" y="657" font-size="11.5" font-weight="500" fill="#64748B">Reconciles statement vs photo evidence; orchestrates 2 re-scan loops</text>


  <rect x="690" y="585" width="540" height="95" rx="8" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5" filter="url(#card-shadow)"/>
