<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop Shadows -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="badge-shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    
    <!-- Arrow Marker -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563EB" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748B" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0D9488" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#E11D48" />
    </marker>
  </defs>


  <!-- Slide Header -->
  <rect x="60" y="35" width="1800" height="90" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="90" y="75" font-size="26" font-weight="800" fill="#0F172A" letter-spacing="-0.5">SPARK FNOL — AGENTIC CONTROL FLOW & VERIFICATION LOOPS</text>
  <text x="90" y="102" font-size="14" font-weight="500" fill="#64748B">Deterministic Execution Sequence: Observe → Plan → Act → Observe → Re-evaluate Cycle</text>
  
  <rect x="1480" y="60" width="350" height="34" rx="17" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <circle cx="1500" cy="77" r="5" fill="#2563EB"/>
  <text x="1516" y="82" font-size="11.5" font-weight="700" fill="#1E40AF" letter-spacing="0.5">AEROPHILIA 2026 HACKATHON · AGENTIC AI</text>


  <!-- ROW 1 CONTAINER -->
  <rect x="60" y="150" width="1800" height="230" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="80" y="176" font-size="11" font-weight="800" fill="#475569" letter-spacing="0.8">PHASE 1: INTAKE, CONTRACTUAL GATING &amp; MULTIMODAL VISION</text>

  <!-- Node 1: Start / Claim Intake -->
  <rect x="90" y="210" width="220" height="120" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" filter="url(#card-shadow)"/>
  <text x="200" y="245" font-size="13" font-weight="800" fill="#1E40AF" text-anchor="middle">CLAIM SUBMISSION</text>
  <text x="200" y="270" font-size="11" font-weight="500" fill="#475569" text-anchor="middle">Claimant Loss Narrative</text>
  <text x="200" y="290" font-size="11" font-weight="500" fill="#475569" text-anchor="middle">+ Accident Damage Photos</text>
  <rect x="130" y="302" width="140" height="18" rx="4" fill="#DBEAFE"/>
  <text x="200" y="315" font-size="9.5" font-weight="700" fill="#1E40AF" text-anchor="middle">FNOL Intake Form</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="310" y1="270" x2="360" y2="270" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- Node 2: Stage 1 Statement Analyst -->
  <rect x="360" y="210" width="260" height="120" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#card-shadow)"/>
  <text x="490" y="240" font-size="13" font-weight="800" fill="#0F172A" text-anchor="middle">STAGE 1: INTAKE PARSING</text>
  <text x="490" y="262" font-size="10.5" font-weight="700" fill="#2563EB" text-anchor="middle">Agent 1: Statement Analyst</text>
  <text x="490" y="286" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">Tool: extract_statement_facts</text>
  <text x="490" y="305" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">Outputs: Claimed zones, date &amp; third-party</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="620" y1="270" x2="670" y2="270" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- Node 3: Stage 2 Policy & Coverage -->
  <rect x="670" y="210" width="270" height="120" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#card-shadow)"/>
  <text x="805" y="240" font-size="13" font-weight="800" fill="#0F172A" text-anchor="middle">STAGE 2: POLICY GATING</text>
  <text x="805" y="262" font-size="10.5" font-weight="700" fill="#2563EB" text-anchor="middle">Agent 4: Coverage Specialist</text>
  <text x="805" y="286" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">Tool: verify_policy_coverage</text>
  <text x="805" y="305" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">Deterministic lookup vs db2_policies.json</text>

  <!-- Arrow 3 -> Diamond 1 -->
  <line x1="940" y1="270" x2="990" y2="270" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- Decision Diamond 1: Coverage Check -->
  <polygon points="1070,220 1160,270 1070,320 980,270" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="1070" y="265" font-size="11" font-weight="800" fill="#92400E" text-anchor="middle">Policy In-Force</text>
  <text x="1070" y="280" font-size="11" font-weight="800" fill="#92400E" text-anchor="middle">&amp; OD Covered?</text>

  <!-- Branch No (Denial flag) -->
  <line x1="1070" y1="220" x2="1070" y2="180" stroke="#E11D48" stroke-width="2"/>
  <line x1="1070" y1="180" x2="1350" y2="180" stroke="#E11D48" stroke-width="2" marker-end="url(#arrow-rose)"/>
  <text x="1100" y="198" font-size="10" font-weight="700" fill="#E11D48">NO (Lapsed / TP Only)</text>
  
  <rect x="1350" y="165" width="240" height="40" rx="6" fill="#FFE4E6" stroke="#E11D48" stroke-width="1"/>
  <text x="1470" y="190" font-size="11" font-weight="700" fill="#9F1239" text-anchor="middle">Flag Contractual Denial (Citations)</text>

  <!-- Branch Yes -> Stage 3 Vision -->
  <line x1="1160" y1="270" x2="1240" y2="270" stroke="#0D9488" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <text x="1195" y="260" font-size="10" font-weight="700" fill="#0D9488">YES</text>

  <!-- Node 4: Stage 3 Vision Appraisal -->
  <rect x="1240" y="210" width="350" height="120" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#card-shadow)"/>
  <text x="1415" y="240" font-size="13" font-weight="800" fill="#0F172A" text-anchor="middle">STAGE 3: MULTIMODAL DAMAGE APPRAISAL</text>
  <text x="1415" y="262" font-size="10.5" font-weight="700" fill="#2563EB" text-anchor="middle">Agent 2: Vision Assessor (gemini-2.5-flash)</text>
  <text x="1415" y="286" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">Tool: analyze_photos_neutral</text>
  <text x="1415" y="305" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">Scans 6 zones &amp; computes cost via data/repair_costs.json</text>

  <!-- Connect Row 1 to Row 2 -->
  <line x1="1415" y1="330" x2="1415" y2="400" stroke="#2563EB" stroke-width="2.5"/>
  <line x1="1415" y1="400" x2="200" y2="400" stroke="#2563EB" stroke-width="2.5"/>
  <line x1="200" y1="400" x2="200" y2="445" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)"/>


  <!-- ROW 2 CONTAINER -->
  <rect x="60" y="420" width="1800" height="250" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="80" y="446" font-size="11" font-weight="800" fill="#1E40AF" letter-spacing="0.8">PHASE 2: FRAUD SCREENING, ENVIRONMENTAL RADAR &amp; AUTONOMOUS VERIFICATION LOOPS</text>

  <!-- Node 5: Stage 4 Fraud & Weather -->
  <rect x="90" y="480" width="310" height="145" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#card-shadow)"/>
  <text x="245" y="508" font-size="13" font-weight="800" fill="#0F172A" text-anchor="middle">STAGE 4: CONSISTENCY SCREENING</text>
  <text x="245" y="530" font-size="10.5" font-weight="700" fill="#4F46E5" text-anchor="middle">Agent 3: Supervisor Brain Agent</text>
  <text x="245" y="555" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">External Tool: verify_weather_open_meteo</text>
  <text x="245" y="574" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">Queries live historical precipitation &amp; WMO radar</text>
  <text x="245" y="598" font-size="10" font-weight="600" fill="#0D9488" text-anchor="middle">Compares Statement Zones vs Photo Damage</text>

  <!-- Arrow to Contradiction Decision -->
  <line x1="400" y1="552" x2="470" y2="552" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- Decision Diamond 2: Contradiction Check -->
  <polygon points="560,490 660,552 560,614 460,552" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="560" y="546" font-size="11" font-weight="800" fill="#92400E" text-anchor="middle">Damage Zone</text>
  <text x="560" y="564" font-size="11" font-weight="800" fill="#92400E" text-anchor="middle">Mismatch?</text>

  <!-- Branch No: Consistent -->
  <line x1="660" y1="552" x2="770" y2="552" stroke="#0D9488" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <text x="700" y="542" font-size="10" font-weight="700" fill="#0D9488">NO (Matches)</text>

  <rect x="770" y="522" width="210" height="60" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.5"/>
  <text x="875" y="546" font-size="11.5" font-weight="800" fill="#0F766E" text-anchor="middle">Consistency Confirmed</text>
  <text x="875" y="565" font-size="10" font-weight="600" fill="#0D9488" text-anchor="middle">Low Fraud Risk Screening</text>

  <!-- Branch Yes: Trigger Autonomous Re-Scan Loops -->
  <line x1="560" y1="614" x2="560" y2="640" stroke="#E11D48" stroke-width="2"/>
  <line x1="560" y1="640" x2="1080" y2="640" stroke="#E11D48" stroke-width="2"/>
  <line x1="1080" y1="640" x2="1080" y2="585" stroke="#E11D48" stroke-width="2" marker-end="url(#arrow-rose)"/>
  <text x="630" y="632" font-size="10" font-weight="700" fill="#E11D48">YES (Disjoint Zones)</text>

  <!-- Loop 1 Card -->
  <rect x="1030" y="480" width="300" height="105" rx="8" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.5" filter="url(#card-shadow)"/>
  <text x="1180" y="505" font-size="12" font-weight="800" fill="#9F1239" text-anchor="middle">VERIFICATION LOOP 1 (Self-Correction)</text>
  <text x="1180" y="525" font-size="10" font-weight="600" fill="#E11D48" text-anchor="middle">Tool: rescan_photos_for_conflict</text>
  <text x="1180" y="548" font-size="9.5" font-weight="500" fill="#64748B" text-anchor="middle">Secondary angle re-scan targeting conflict coordinates.</text>
  <text x="1180" y="568" font-size="9.5" font-weight="700" fill="#0D9488" text-anchor="middle">If resolved: Reconciled &amp; Cleared</text>

  <!-- Arrow Loop 1 -> Loop 2 -->
  <line x1="1330" y1="532" x2="1390" y2="532" stroke="#E11D48" stroke-width="2" marker-end="url(#arrow-rose)"/>
  <text x="1360" y="522" font-size="9" font-weight="700" fill="#E11D48">Unresolved</text>

  <!-- Loop 2 Card -->
  <rect x="1390" y="480" width="310" height="105" rx="8" fill="#FFFFFF" stroke="#9F1239" stroke-width="2" filter="url(#card-shadow)"/>
  <text x="1545" y="505" font-size="12" font-weight="800" fill="#9F1239" text-anchor="middle">VERIFICATION LOOP 2 (Final Check)</text>
  <text x="1545" y="525" font-size="10" font-weight="600" fill="#E11D48" text-anchor="middle">Tool: rescan_photos_for_conflict (Max Capped)</text>
  <text x="1545" y="548" font-size="9.5" font-weight="500" fill="#64748B" text-anchor="middle">Final multi-photo consistency pass across evidence.</text>
  <text x="1545" y="568" font-size="9.5" font-weight="800" fill="#E11D48" text-anchor="middle">If still contradicted: Flag High Fraud Risk (Tier 3)</text>

  <!-- Connect Row 2 to Row 3 -->
  <line x1="875" y1="582" x2="875" y2="690" stroke="#2563EB" stroke-width="2.5"/>
  <line x1="1545" y1="585" x2="1545" y2="690" stroke="#2563EB" stroke-width="2.5"/>
  <line x1="1545" y1="690" x2="200" y2="690" stroke="#2563EB" stroke-width="2.5"/>
  <line x1="200" y1="690" x2="200" y2="735" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)"/>


  <!-- ROW 3 CONTAINER -->
  <rect x="60" y="710" width="1800" height="260" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="80" y="736" font-size="11" font-weight="800" fill="#475569" letter-spacing="0.8">PHASE 3: DETERMINISTIC DECISION GATE, SURVEYOR MATCHING &amp; ADJUSTER SIGN-OFF</text>

  <!-- Node 6: Stage 5 Decision Gate -->
  <rect x="90" y="760" width="260" height="130" rx="10" fill="#FFFFFF" stroke="#0D9488" stroke-width="2" filter="url(#card-shadow)"/>
  <text x="220" y="790" font-size="13" font-weight="800" fill="#0F172A" text-anchor="middle">STAGE 5: DECISION GATE</text>
  <text x="220" y="812" font-size="10.5" font-weight="700" fill="#0D9488" text-anchor="middle">Agent 5: Spark Decision Agent</text>
  <text x="220" y="836" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">decision_gate.py · Pure Python Engine</text>
  <text x="220" y="855" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">Evaluates financial &amp; risk thresholds top-down</text>
  <text x="220" y="874" font-size="9.5" font-weight="700" fill="#1E40AF" text-anchor="middle">Zero LLM math hallucination risk</text>

  <!-- Arrow to Tiers -->
  <line x1="350" y1="825" x2="400" y2="825" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- Decision Output Tiers -->
  <!-- Tier 1 -->
  <rect x="400" y="760" width="240" height="55" rx="6" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
  <text x="520" y="784" font-size="12" font-weight="800" fill="#065F46" text-anchor="middle">Tier 1: Fast-Track STP</text>
  <text x="520" y="802" font-size="10" font-weight="500" fill="#047857" text-anchor="middle">Repair ≤ ₹25k &amp; Low Risk (Auto-Offer)</text>

  <!-- Tier 2 -->
  <rect x="400" y="825" width="240" height="55" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="520" y="849" font-size="12" font-weight="800" fill="#1E40AF" text-anchor="middle">Tier 2: Adjuster Sign-Off</text>
  <text x="520" y="867" font-size="10" font-weight="500" fill="#1D4ED8" text-anchor="middle">Repair &gt; ₹25k / Total Loss / Injury</text>

  <!-- Tier 3 -->
  <rect x="400" y="890" width="240" height="55" rx="6" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="520" y="914" font-size="12" font-weight="800" fill="#991B1B" text-anchor="middle">Tier 3: SIU Escalation</text>
  <text x="520" y="932" font-size="10" font-weight="500" fill="#B91C1C" text-anchor="middle">High Fraud Risk / Coverage Gate Denial</text>

  <!-- Connect Tiers to Surveyor Recommender -->
  <line x1="640" y1="852" x2="710" y2="852" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- Node 7: Surveyor Recommendation Engine -->
  <rect x="710" y="760" width="280" height="185" rx="10" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2" filter="url(#card-shadow)"/>
  <text x="850" y="790" font-size="13" font-weight="800" fill="#0F172A" text-anchor="middle">SURVEYOR DISPATCH ENGINE</text>
  <text x="850" y="812" font-size="10.5" font-weight="700" fill="#7C3AED" text-anchor="middle">Agent 6: Expertise Matching</text>
  <text x="850" y="836" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">Evaluates 5 Triage Criteria:</text>
  <text x="850" y="855" font-size="9.5" font-weight="500" fill="#64748B" text-anchor="middle">• Damage Severity Classification</text>
  <text x="850" y="873" font-size="9.5" font-weight="500" fill="#64748B" text-anchor="middle">• Repair Cost Threshold &gt; ₹30,000</text>
  <text x="850" y="891" font-size="9.5" font-weight="500" fill="#64748B" text-anchor="middle">• Statement vs. Photo Physical Match</text>
  <text x="850" y="909" font-size="9.5" font-weight="500" fill="#64748B" text-anchor="middle">• Photographic Ambiguity / Sufficiency</text>
  <text x="850" y="927" font-size="9.5" font-weight="500" fill="#64748B" text-anchor="middle">• Bodily Injury / Third-Party Liability</text>

  <!-- Arrow to Junior / Senior Categories -->
  <line x1="990" y1="852" x2="1050" y2="852" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- Senior vs Junior Cards -->
  <rect x="1050" y="775" width="250" height="65" rx="8" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="1175" y="802" font-size="12" font-weight="800" fill="#5B21B6" text-anchor="middle">Senior Surveyor Category</text>
  <text x="1175" y="822" font-size="10" font-weight="500" fill="#6D28D9" text-anchor="middle">Cost &gt; ₹30k / Severe / Fraud / Injury</text>

  <rect x="1050" y="860" width="250" height="65" rx="8" fill="#CCFBF1" stroke="#0D9488" stroke-width="1.5"/>
  <text x="1175" y="887" font-size="12" font-weight="800" fill="#0F766E" text-anchor="middle">Junior Surveyor Category</text>
  <text x="1175" y="907" font-size="10" font-weight="500" fill="#0D9488" text-anchor="middle">Routine Low/Moderate Physical Check</text>

  <!-- Arrow to Cockpit Review -->
  <line x1="1300" y1="852" x2="1370" y2="852" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- Node 8: Human Adjuster Governance -->
  <rect x="1370" y="760" width="460" height="185" rx="10" fill="#FFFFFF" stroke="#0F172A" stroke-width="2" filter="url(#card-shadow)"/>
  <rect x="1390" y="775" width="420" height="24" rx="4" fill="#0F172A"/>
  <text x="1600" y="792" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">HUMAN ADJUSTER COCKPIT GOVERNANCE (HITL)</text>
  
  <text x="1400" y="825" font-size="11.5" font-weight="700" fill="#0F172A">• Comprehensive Analysis Report (5-Section Audit Dossier)</text>
  <text x="1400" y="848" font-size="11" font-weight="500" fill="#475569">  Export options: 1-Click Print · Save as PDF · Copy Text · Download</text>

  <text x="1400" y="875" font-size="11.5" font-weight="700" fill="#0F172A">• Surveyor Dispatch Confirmation &amp; Caseload Balancing</text>
  <text x="1400" y="898" font-size="11" font-weight="500" fill="#475569">  Assigns field surveyor with custom note; updates Surveyor Roster view</text>

  <rect x="1400" y="912" width="130" height="24" rx="4" fill="#D1FAE5" stroke="#10B981" stroke-width="1"/>
  <text x="1465" y="928" font-size="10" font-weight="800" fill="#065F46" text-anchor="middle">✓ Settle / Execute</text>

  <rect x="1545" y="912" width="130" height="24" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
  <text x="1610" y="928" font-size="10" font-weight="800" fill="#475569" text-anchor="middle">✕ Dismiss Claim</text>

  <rect x="1690" y="912" width="125" height="24" rx="4" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
  <text x="1752" y="928" font-size="10" font-weight="800" fill="#1E40AF" text-anchor="middle">💬 Chat / Edit</text>

</svg>